[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaos-shorts-worker"
version = "0.1.0"
description = "Deterministic local demo CLI for the Media OS Shorts worker"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mediaos-worker = "shorts_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
