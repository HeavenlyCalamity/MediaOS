spring.application.name=mediaos-api
server.port=${API_PORT:8080}
mediaos.data-dir=${MEDIAOS_DATA_DIR:${user.home}/.mediaos}
mediaos.upload.max-video-bytes=${MEDIAOS_MAX_VIDEO_BYTES:524288000}
mediaos.ffprobe=${MEDIAOS_FFPROBE:ffprobe}
mediaos.worker.dir=${MEDIAOS_WORKER_DIR:../../workers/shorts-worker}
mediaos.worker.python=${MEDIAOS_PYTHON:python}
mediaos.worker.job-timeout-seconds=${MEDIAOS_WORKER_TIMEOUT_SECONDS:900}
mediaos.worker.max-concurrent-jobs=${MEDIAOS_MAX_CONCURRENT_PRODUCTION_JOBS:1}
mediaos.provider.config-json=${MEDIAOS_PROVIDER_CONFIG_JSON:}
mediaos.provider.real-enabled=${MEDIAOS_REAL_PROVIDERS_ENABLED:false}
spring.servlet.multipart.max-file-size=${MEDIAOS_MAX_UPLOAD_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MEDIAOS_MAX_REQUEST_SIZE:505MB}
